name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly vuln sweep (Mondays 06:00 UTC) so newly-disclosed advisories in
    # already-pinned dependencies surface even without a code change.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # go.mod is the single source of truth for the toolchain, so CI cannot
          # drift from it. It pins 1.26.10, the first release with the fixes for
          # GO-2026-6809 and the GO-2026-6610..6617 net/http and HTTP/2 set; Go
          # 1.25 is out of support and gets no security fixes at all.
          go-version-file: go.mod

      - name: Verify go.mod
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=cover.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -20

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: cover
          path: cover.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        # PINNED, not `latest`. golangci-lint refuses a module targeting a newer
        # Go than the one it was built with, so `latest` made the lint gate
        # depend on whichever binary was released last; older v1.64.x builds
        # already broke this way on a Go upgrade. v2.15.0 is built with Go
        # 1.27.0, so it lints this go1.26.10 module. Bump it deliberately
        # alongside go.mod.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        # PINNED, not @latest. setup-go sets GOTOOLCHAIN=local, so `go install`
        # cannot pull a newer toolchain to satisfy a raised floor: when x/vuln
        # v1.8.0 raised its floor to go >= 1.26.0, @latest failed the INSTALL
        # on the old 1.25 toolchain before the scan ran at all. v1.7.0 declares
        # go 1.25.0, which the go.mod toolchain (1.26.10) satisfies. Now that
        # go.mod is on 1.26, v1.8.0's floor is also met, so this pin can be
        # raised; it is left at the verified v1.7.0 to keep one change per pull
        # request.
        #
        # Pinning the binary does NOT stale the advisories: govulncheck fetches
        # the vulnerability database at runtime, so coverage stays current.
        # Raise this pin together with go.mod, not on its own.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Run govulncheck
        run: govulncheck ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [go]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: sleipnir:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

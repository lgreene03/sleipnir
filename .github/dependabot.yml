version: 2

# Keep go modules, GitHub Actions and the digest-pinned Docker base images
# fresh.
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      observability:
        patterns:
          - "github.com/prometheus/*"
      kafka:
        patterns:
          - "github.com/segmentio/kafka-go"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      # The golang builder image must match go.mod's `go` directive, which CI
      # treats as the single source of truth for the toolchain, and dependabot's
      # gomod updates never move that directive. A minor Go release (1.26 to
      # 1.27) is therefore a deliberate change made to go.mod and the Dockerfile
      # together, not a routine image bump. Patch releases still arrive here.
      - dependency-name: "golang"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
